<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Workspace — AI Desk</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#11192b;--line:#ffffff15;--text:#f4f7ff;--muted:#929fbd;--accent:#8b7cff;--teal:#54e0d0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 72% 0,#45388a35,transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:20px 24px}.top{display:flex;align-items:center;gap:18px;padding:5px 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--teal))}.top h1{margin:0;font-size:16px}.top h1 small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}.home{color:var(--muted);text-decoration:none;font-size:13px;margin-right:auto}.home:hover{color:var(--text)}.controls{display:flex;gap:8px}.controls select,.controls input,textarea,.send{font:inherit;color:var(--text);background:#ffffff08;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}.controls select{min-width:135px}.controls input{width:155px}.controls select:focus,.controls input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b7cff22}.messages{flex:1;overflow:auto;width:100%;max-width:760px;margin:auto;padding:42px 10px 28px}.welcome{text-align:center;padding:clamp(25px,8vh,78px) 15px 30px}.welcome .spark{font-size:30px;color:#aaa0ff}.welcome h2{font-size:clamp(24px,4vw,34px);letter-spacing:-.04em;margin:14px 0 9px}.welcome p{color:var(--muted);margin:0;font-size:14px}.bubble{max-width:78%;padding:14px 17px;margin:14px 0;border-radius:17px;white-space:pre-wrap;line-height:1.65;font-size:15px;animation:rise .25s ease-out}.user{margin-left:auto;background:linear-gradient(135deg,#6e5fe3,#5145ba);border-bottom-right-radius:5px}.assistant{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.composer{width:100%;max-width:760px;margin:0 auto;padding:14px 0 4px}.composer-box{display:flex;gap:10px;align-items:flex-end;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:0 14px 40px #0003}.composer textarea{flex:1;resize:none;border:0;background:transparent;padding:9px;min-height:42px;max-height:140px;line-height:1.5}.composer textarea:focus{box-shadow:none}.send{display:grid;place-items:center;width:42px;height:42px;padding:0;background:var(--text);color:#10162a;border:0;font-size:18px;font-weight:800;cursor:pointer;transition:transform .2s,opacity .2s}.send:hover{transform:translateY(-2px)}.send:disabled{opacity:.45;cursor:wait;transform:none}.hint{color:#64718f;font-size:11px;text-align:center;margin:9px 0 0}@media(max-width:680px){.wrap{padding:16px 14px}.top{flex-wrap:wrap;gap:12px}.home{order:3;width:100%;margin:0}.controls{width:100%}.controls select,.controls input{flex:1;min-width:0;width:auto}.messages{padding-top:20px}.bubble{max-width:90%}.hint{display:none}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="mark" aria-hidden="true">✦</span><h1>AI Desk<small>personal workspace</small></h1></div><a class="home" href="/">← กลับหน้าหลัก</a><div class="controls" aria-label="การตั้งค่าโมเดล"><select id="provider" aria-label="เลือก provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select><input id="model" aria-label="ชื่อโมเดล" placeholder="model (optional)"></div></header><section id="messages" class="messages" aria-live="polite"><div class="welcome" id="welcome"><div class="spark" aria-hidden="true">✦</div><h2>วันนี้อยากสร้างอะไร?</h2><p>เริ่มต้นด้วยคำถาม ไอเดีย หรือสิ่งที่อยากทำให้สำเร็จ</p></div></section><form id="form" class="composer"><div class="composer-box"><textarea id="input" rows="1" placeholder="พิมพ์ข้อความของคุณ..." aria-label="ข้อความ" required></textarea><button class="send" type="submit" aria-label="ส่งข้อความ">↑</button></div><p class="hint">กด Ctrl / ⌘ + Enter เพื่อส่ง</p></form></main><script src="/chat/app.js"></script></body></html>
